const cv=document.getElementById('c'), cx=cv.getContext('2d');
// roundRect polyfill for older mobile browsers
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r instanceof Array) r=r[0]||0;
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);
    this.lineTo(x+w-r,y); this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r); this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h); this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r); this.arcTo(x,y,x+r,y,r);
    this.closePath();
  };
}
let S=1;
function vw(){return window.visualViewport?window.visualViewport.width:window.innerWidth;}
function vh(){return window.visualViewport?window.visualViewport.height:window.innerHeight;}
function resize(){
  const ar=9/16, w=vw(), h=vh();
  if(w/h<ar){cv.width=w;cv.height=Math.round(w/ar);}
  else{cv.height=h;cv.width=Math.round(h*ar);}
  S=cv.width/390;
}
resize();
window.addEventListener('resize',resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);

// ── Audio (Web Audio API) ──
let AC=null, masterGain=null;
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  masterGain=AC.createGain(); masterGain.connect(AC.destination);
  bgmStart();
}
function tone(f,d,tp,v,dl){
  if(!AC||!masterGain)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(masterGain);
  o.type=tp||'triangle';o.frequency.value=f;
  const t=AC.currentTime+(dl||0);
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(v||0.18,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d+0.05);
}
function drum(f,d,dl){
  if(!AC||!masterGain)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(masterGain);
  o.type='sine';
  const t=AC.currentTime+(dl||0);
  o.frequency.setValueAtTime(f,t);
  o.frequency.exponentialRampToValueAtTime(f*.4,t+d);
  g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d+.05);
}
function hat(dl){
  if(!AC||!masterGain)return;
  const N=Math.floor(AC.sampleRate*.06),buf=AC.createBuffer(1,N,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*(1-i/N);
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='highpass';f.frequency.value=7000;
  s.buffer=buf;s.connect(f);f.connect(g);g.connect(masterGain);
  const t=AC.currentTime+(dl||0);g.gain.setValueAtTime(.07,t);s.start(t);
}
function sfxJump(){tone(320,.08,'square',.14);tone(520,.12,'triangle',.1,.07);}
function sfxDouble(){[440,660,880].forEach((f,i)=>tone(f,.1,'triangle',.16,i*.06));}
function sfxCollect(){[880,1100].forEach((f,i)=>tone(f,.09,'sine',.16,i*.055));}
function sfxSpecial(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.13,'triangle',.18,i*.065));}
function sfxHit(){tone(120,.22,'sawtooth',.3);tone(80,.28,'square',.18,.1);}
function sfxBuy(){[523,659,784].forEach((f,i)=>tone(f,.1,'triangle',.2,i*.06));}

// BGM — lookahead scheduler to avoid drift and overlap
let bgmT=null, bgmRunning=false, bgmNext=0;
const ND=60/134;
const ML=[523,659,784,880,784,659,523,440,523,659,784,880,1046,880,784,659];
const BS=[262,0,196,0,220,0,262,0,262,0,196,0,175,0,196,0];
function bgmScheduleBar(){
  if(!bgmRunning||!AC) return;
  const t=bgmNext;
  ML.forEach((f,i)=>{if(f)tone(f,ND*.6,'triangle',.08,t-AC.currentTime+i*ND);});
  BS.forEach((f,i)=>{if(f)tone(f,ND*.45,'square',.05,t-AC.currentTime+i*ND);});
  [0,4,8,12].forEach(i=>drum(85,ND*.3,t-AC.currentTime+i*ND));
  [2,6,10,14].forEach(i=>drum(65,ND*.25,t-AC.currentTime+i*ND));
  [0,2,4,6,8,10,12,14].forEach(i=>hat(t-AC.currentTime+i*ND));
  bgmNext+=ND*16;
  bgmT=setTimeout(bgmScheduleBar,Math.max(0,(bgmNext-AC.currentTime-0.15)*1000));
}
function bgmStart(){
  if(bgmRunning||!AC)return;
  bgmRunning=true;
  bgmNext=AC.currentTime+0.1;
  // Fade in master gain
  masterGain.gain.cancelScheduledValues(AC.currentTime);
  masterGain.gain.setValueAtTime(0,AC.currentTime);
  masterGain.gain.linearRampToValueAtTime(1,AC.currentTime+0.3);
  bgmScheduleBar();
}
function bgmStop(){
  bgmRunning=false;
  if(bgmT){clearTimeout(bgmT);bgmT=null;}
  // Fade out so lingering notes don't overlap on restart
  if(AC&&masterGain){
    masterGain.gain.cancelScheduledValues(AC.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value,AC.currentTime);
    masterGain.gain.linearRampToValueAtTime(0,AC.currentTime+0.2);
  }
}

    state:'run', // run|jump|djump|cheer
    cheerCD:0,
    invTimer:0, dead:false,
    shielded:inv.shield>0,
    hasLife:inv.life>0,
    usedLife:false,
    magnet:inv.magnet>0,
    magnetR:inv.magnet>0?80*S:0,
    scoreMulti:inv.x2>0?2:1,
    jumpV:jv,
    runF:0
  };
  // consume equipped items (all single-run)
  if(inv.shield>0) inv.shield--;
  if(inv.magnet>0) inv.magnet--;
  if(inv.x2>0)     inv.x2--;
  if(inv.hjump>0)  inv.hjump--;
  if(inv.life>0){inv.life--;player.hasLife=true;}
  saveInv();
  worldObjs=[]; particles=[]; floatTxts=[];
  genFrontier=0; segCounter=0;
  generateWorld(0, cv.width*3);
}

// ── World Generation ──
let genFrontier=0;
function generateWorld(from, to){
  genFrontier=Math.max(genFrontier,from);
  while(genFrontier<to){
    const seg=nextSegment();
    genFrontier+=seg.len;
  }
}
let segCounter=0;
function nextSegment(){
  segCounter++;
  const d=dist+genFrontier-PX();
  const difficulty=Math.min(1,d/(6000*S));
  let pool;
  if(difficulty<0.12) pool=['flat','flat','flat'];
  else if(difficulty<0.25) pool=['flat','flat','hurdle'];
  else if(difficulty<0.45) pool=['flat','hurdle','hurdle','platform'];
  else if(difficulty<0.7)  pool=['hurdle','hurdle','platform','combo'];
  else pool=['hurdle','hurdle','platform','combo','combo'];
  const type=pool[Math.floor(Math.random()*pool.length)];
  const x=genFrontier;
  const W=S;

  switch(type){
    case 'flat': return makeSeg(x,(100+Math.random()*70)*W,[],[starRow(x+35*W)]);
    case 'hurdle':{
      const h=(38+Math.random()*38)*W; // 38–76px, always jumpable
      const ob={type:'hurdle',x:x+70*W,y:GY()-h,w:22*W,h,color:'#e63946'};
      const h2=difficulty>0.35&&Math.random()<.45
        ?{type:'hurdle',x:x+140*W,y:GY()-(h*.8),w:22*W,h:h*.8,color:'#c0392b'}:null;
      return makeSeg(x,190*W,[ob,...(h2?[h2]:[])],[starRow(x+100*W,-32*W)]);
    }
    case 'platform':{
      const pw=(90+Math.random()*55)*W, py=GY()-(75+Math.random()*50)*W;
      const pl={type:'platform',x:x+65*W,y:py,w:pw,h:14*W};
      const items=[];
      for(let i=0;i<3;i++) items.push({type:'star',x:x+75*W+i*30*W,y:py-22*W});
      if(Math.random()<.18) items.push({type:'special',x:x+65*W+pw/2,y:py-28*W,stype:randSpecial()});
      return makeSeg(x,(pw+150)*W,[pl],[...items,...[starRow(x+20*W)]]);
    }
    case 'combo':{
      const py=GY()-(70+Math.random()*40)*W, pw=85*W;
      const pl={type:'platform',x:x+45*W,y:py,w:pw,h:14*W};
      const oh=(36+Math.random()*28)*W;
      const ob={type:'hurdle',x:x+pw+100*W,y:GY()-oh,w:22*W,h:oh,color:'#e63946'};
      return makeSeg(x,230*W,[pl,ob],[
        {type:'star',x:x+60*W,y:py-20*W},
        {type:'star',x:x+85*W,y:py-20*W},
        ...(Math.random()<.2?[{type:'special',x:x+110*W,y:py-28*W,stype:randSpecial()}]:[]),
        {type:'star',x:x+170*W,y:GY()-30*W},
      ]);
    }
    default: return makeSeg(x,120*W,[],[]);
  }
}
function makeSeg(x,len,obs,items){
  obs.forEach(o=>{o.worldX=o.x; worldObjs.push({...o,worldX:o.x});});
  items.forEach(it=>{it.worldX=it.x; worldObjs.push({...it,worldX:it.x,pulse:0,collected:false});});
  return {x,len};
}
function starRow(x,yOff){
  const n=2+Math.floor(Math.random()*3);
  const objs=[];
  for(let i=0;i<n;i++) objs.push({type:'star',x:x+i*28*S,y:GY()+(yOff||-32*S)});
  return objs; // makeSeg handles pushing to worldObjs
}
function randSpecial(){
  const t=['shield','magnet','x2'];
  return t[Math.floor(Math.random()*t.length)];
}

// ── Collision helpers ──
function scrX(worldX){ return worldX - dist - PX() + PX(); }
// actual screen x given world coord:
function wx2sx(wx){ return wx - dist + PX(); }

// ── Input ──
let ts={x:0,y:0,t:0};
let jumpReleased=true; // must release before a new jump is accepted
function cutJump(){
  if(player&&player.vy<0&&player.state==='jump') player.vy*=JUMP_CUT;
}
function tryJump(){
  if(!jumpReleased) return; // still holding — block
  jumpReleased=false;
  doJump();
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio();
  if(e.touches.length>=2&&gs==='playing'){ doCheerBurst(); return; }
  const t=e.touches[0]; ts={x:t.clientX,y:t.clientY,t:Date.now()};
  if(gs==='playing') tryJump();
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  if(gs==='playing'){ cutJump(); jumpReleased=true; }
  const t=e.changedTouches[0];
  const r=cv.getBoundingClientRect();
  const mx=(t.clientX-r.left)*(cv.width/r.width), my=(t.clientY-r.top)*(cv.height/r.height);
  if(shopOpen){ handleShopClick(mx,my); return; }
  if(gs==='splash'||gs==='gameover'){ handleMenuClick(mx,my); return; }
  if(gs==='playing'&&mx<44*S&&my<44*S) goHome();
},{passive:false});
cv.addEventListener('mousedown',e=>{
  initAudio(); ts={x:e.clientX,y:e.clientY,t:Date.now()};
  if(gs==='playing') tryJump();
});
cv.addEventListener('mouseup',e=>{
  if(gs==='playing'){ cutJump(); jumpReleased=true; return; }
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(cv.width/r.width), my=(e.clientY-r.top)*(cv.height/r.height);
  if(shopOpen){ handleShopClick(mx,my); return; }
  handleMenuClick(mx,my);
});
document.addEventListener('keydown',e=>{
  if(e.repeat) return; // ignore key-repeat
  initAudio();
  if(gs!=='playing') return;
  if(e.code==='ArrowUp'||e.code==='Space'){e.preventDefault();tryJump();}
  if(e.code==='KeyC'||e.code==='ShiftLeft'){e.preventDefault();doCheerBurst();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp'||e.code==='Space'){ cutJump(); jumpReleased=true; }
});

function goHome(){
  bgmStop(); gs='splash'; shopOpen=false;
}

function doJump(){
  const p=player;
  if(p.jumps===0&&(p.onGround||p.onPlat)){
    p.jumps=1; p.vy=p.jumpV; p.onGround=false; p.onPlat=false;
    p.state='jump'; sfxJump();
    burst(p.x+PW()/2,p.y-PH()*.3,['#ff69b4','#ffd700','#fff'],6,.8);
  } else if(p.jumps===1){
    p.jumps=2; p.vy=DJUMP_V(); p.state='djump';
    sfxDouble();
    burst(p.x+PW()/2,p.y-PH()*.5,['#c084fc','#ffd700','#60a5fa'],10,1.2);
  }
}
function doCheerBurst(){
  const p=player;
  if(!p||p.cheerCD>0) return;
  p.vy=CHEER_V(); p.onGround=false; p.onPlat=false; p.jumps=2;
  p.state='cheer'; p.invTimer=100; p.cheerCD=480; // 8s cooldown
  sfxSpecial();
  burst(p.x+PW()/2,p.y-PH()/2,['#ff69b4','#ffd700','#fff','#c084fc','#38bdf8'],28,2);
  addFloat('CHEER! 🎀','#ffd700',22*S,p.x+PW()/2,p.y-PH()-10*S);
}

// ── Particles / Floats ──
function burst(x,y,cols,n,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(1+Math.random()*2.5)*S*(sp||1);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5*S,
      life:35+Math.random()*20,max:55,col:cols[Math.floor(Math.random()*cols.length)],
      r:(2+Math.random()*3.5)*S});
  }
}
function addFloat(txt,col,sz,x,y){
  floatTxts.push({txt,col,sz,x,y,vy:-1.5*S,life:65,max:65});
}

// ── Update ──
function update(){
  if(gs!=='playing') return;
  frame++;
  spd=Math.min((3.8+frame*.002)*S,14*S);
  dist+=spd;
  bgOffset+=spd;

  // ensure world is generated ahead
  generateWorld(dist,dist+cv.width*2.5);

  const p=player;
  const pw=PW(), ph=PH();
  const gy=GY();

  // Cooldowns
  if(p.cheerCD>0) p.cheerCD--;
  if(p.invTimer>0) p.invTimer--;

  // Gravity
  if(!p.onGround&&!p.onPlat){
    p.vy+=GRAVITY();
    p.y+=p.vy;
  }

  // Running frame
  if(p.onGround||p.onPlat) p.runF++;

  // Magnet
  if(p.magnet){
    worldObjs.forEach(o=>{
      if(o.collected||o.type!=='star') return;
      const sx=wx2sx(o.worldX), sy=o.y;
      const px2=p.x+PW()/2, py2=p.y-PH()/2;
      const dd=Math.sqrt((sx-px2)**2+(sy-py2)**2);
      if(dd>1&&dd<p.magnetR){ o.worldX+=((px2-sx)/dd)*5*S; o.y+=(py2-sy)/dd*5*S; }
    });
  }

  // Score multiplier
  score=Math.floor(dist*0.15+stars*2);

  // Remove far-left objects
  worldObjs=worldObjs.filter(o=>wx2sx(o.worldX)>-100*S);

  // Platform collision
  p.onGround=false; p.onPlat=false;
  let landed=false;
  worldObjs.forEach(o=>{
    const sx=wx2sx(o.worldX);
    if(o.type==='platform'){
      const ox=sx, oy=o.y, ow=o.w, oh=o.h;
      if(p.vy>=0&&!landed&&p.x+pw-8*S>ox&&p.x+8*S<ox+ow&&p.y>=oy&&p.y<=oy+oh+p.vy+4*S){
        p.y=oy; p.vy=0; p.onPlat=true; p.jumps=0; p.state='run'; landed=true;
      }
    }
  });

  // Ground
  if(!landed&&p.y>=gy){
    p.y=gy; p.vy=0; p.onGround=true; p.jumps=0;
    if(p.state!=='run') p.state='run';
  }

  // Fell off screen
  if(p.y>cv.height+80*S) hitPlayer();

  // Obstacles
  worldObjs.forEach(o=>{
    if(o.collected) return;
    const sx=wx2sx(o.worldX);
    if(o.type==='hurdle'&&p.invTimer===0){
      const ox=sx,oy=o.y,ow=o.w,oh=o.h;
      const margin=8*S;
      if(p.x+pw-margin>ox&&p.x+margin<ox+ow&&p.y>oy&&p.y-ph<oy+oh){
        hitPlayer();
      }
    }
    // Collectibles
    if(o.type==='star'||o.type==='special'){
      const isx=wx2sx(o.worldX), isy=o.y;
      const margin=24*S;
      if(Math.abs(isx-(p.x+pw/2))<margin&&Math.abs(isy-p.y+ph/2)<margin*1.2){
        o.collected=true;
        if(o.type==='star'){ stars++; ST.set('stars',stars); sfxCollect();
          burst(isx,isy,['#ffd700','#fff','#fbbf24'],8,1);
          addFloat('+⭐',  '#ffd700',17*S,isx,isy-10*S);
        } else {
          sfxSpecial();
          const lbl={shield:'🛡️ Schild!',magnet:'🧲 Magnet!',x2:'⚡ x2 Score!'}[o.stype]||'Power!';
          addFloat(lbl,'#c084fc',16*S,isx,isy-14*S);
          burst(isx,isy,['#c084fc','#ffd700','#fff','#38bdf8'],18,1.3);
          if(o.stype==='shield') p.shielded=true;
          else if(o.stype==='magnet'){ p.magnet=true; p.magnetR=80*S; }
          else if(o.stype==='x2') p.scoreMulti=2;
        }
      }
    }
  });

  // Particles / floats
  particles=particles.filter(p2=>{p2.x+=p2.vx;p2.y+=p2.vy;p2.vy+=.12*S;p2.life--;return p2.life>0;});
  floatTxts=floatTxts.filter(f=>{f.y+=f.vy;f.life--;return f.life>0;});

  if(p.dead){ bgmStop(); gs='gameover'; if(score>hiScore){hiScore=score;ST.set('hi',hiScore);} }
}

function hitPlayer(){
  const p=player;
  if(p.invTimer>0) return;
  if(p.shielded){ p.shielded=false; p.invTimer=90;
    burst(p.x+PW()/2,p.y-PH()/2,['#38bdf8','#fff','#c084fc'],20,1.5);
    addFloat('SCHILD!','#38bdf8',22*S,p.x+PW()/2,p.y-PH()-10*S); return; }
  if(p.hasLife&&!p.usedLife){ p.usedLife=true; p.invTimer=120;
    burst(p.x+PW()/2,p.y-PH()/2,['#ffd700','#ff69b4','#fff'],22,1.5);
    addFloat('EXTRA LEBEN!','#ffd700',20*S,p.x+PW()/2,p.y-PH()-10*S); return; }
  sfxHit();
  burst(p.x+PW()/2,p.y-PH()/2,['#ef4444','#ff69b4','#ffd700','#fff'],28,1.8);
  p.dead=true;
}

// ── Draw Background ──
function drawBG(){
  // Sky
  const g=cx.createLinearGradient(0,0,0,GY());
  g.addColorStop(0,'#04001a'); g.addColorStop(.5,'#0d1a5e'); g.addColorStop(1,'#1535b0');
  cx.fillStyle=g; cx.fillRect(0,0,cv.width,GY());

  // Arena lights
  [[.15,.12],[.5,.06],[.85,.12]].forEach(([fx,fy])=>{
    const lx=fx*cv.width,ly=fy*cv.height;
    const gr=cx.createRadialGradient(lx,ly,0,lx,ly,80*S);
    gr.addColorStop(0,'rgba(255,245,200,.45)'); gr.addColorStop(1,'rgba(255,245,200,0)');
    cx.fillStyle=gr; cx.fillRect(0,0,cv.width,GY()*.8);
  });

  // Crowd
  const cc=['#e879f9','#fbbf24','#f43f5e','#34d399','#60a5fa','#ff69b4'];
  for(let row=0;row<3;row++){
    const ry=GY()*.06+row*GY()*.18;
    const n=20+row*5;
    for(let i=0;i<n;i++){
      const bx=cv.width*.02+(i/(n-1))*cv.width*.96;
      const bob=Math.sin(Date.now()/360+i+row)*2.2*S;
      cx.fillStyle=cc[(i+row)%cc.length]; cx.globalAlpha=.65+.25*Math.sin(Date.now()/480+i);
      cx.beginPath(); cx.arc(bx,ry+bob,3.8*S,0,Math.PI*2); cx.fill();
      cx.globalAlpha=.45; cx.fillStyle='#110033';
      cx.fillRect(bx-2*S,ry+bob+4*S,4*S,5*S);
    }
  }
  cx.globalAlpha=1;

  // Ground
  const gg=cx.createLinearGradient(0,GY(),0,cv.height);
  gg.addColorStop(0,'#1a38c8'); gg.addColorStop(.15,'#1228a0');
  gg.addColorStop(.5,'#0a1878'); gg.addColorStop(1,'#04082a');
  cx.fillStyle=gg; cx.fillRect(0,GY(),cv.width,cv.height-GY());

  // Ground highlight
  cx.fillStyle='rgba(255,255,255,.18)'; cx.fillRect(0,GY(),cv.width,3*S);

  // Scrolling floor pattern
  cx.strokeStyle='rgba(255,255,255,.06)'; cx.lineWidth=S;
  for(let i=0;i<14;i++){
    const tx=((i*38*S-bgOffset*.35)%(cv.width+38*S)+cv.width+38*S)%(cv.width+38*S)-19*S;
    cx.beginPath(); cx.moveTo(tx,GY()); cx.lineTo(tx,cv.height); cx.stroke();
  }

}

// ── Draw World Objects ──
function drawWorld(){
  worldObjs.forEach(o=>{
    if(o.collected) return;
    const sx=wx2sx(o.worldX);
    if(sx+200*S<0||sx>cv.width+50*S) return;

    if(o.type==='platform'){
      cx.save();
      const g=cx.createLinearGradient(sx,o.y,sx,o.y+o.h);
      g.addColorStop(0,'#60a5fa'); g.addColorStop(1,'#1e3a8a');
      cx.fillStyle=g; cx.beginPath(); cx.roundRect(sx,o.y,o.w,o.h,4*S); cx.fill();
      cx.fillStyle='rgba(255,255,255,.3)'; cx.fillRect(sx+3*S,o.y+2*S,o.w-6*S,3*S);
      cx.restore();
    }
    else if(o.type==='hurdle'){
      cx.save();
      const g=cx.createLinearGradient(sx,o.y,sx+o.w,o.y+o.h);
      g.addColorStop(0,'#ef4444'); g.addColorStop(1,'#7f1d1d');
      cx.fillStyle=g;
      cx.fillRect(sx,o.y,9*S,o.h); cx.fillRect(sx+o.w-9*S,o.y,9*S,o.h);
      cx.fillStyle='#fbbf24'; cx.fillRect(sx,o.y,o.w,11*S);
      cx.fillStyle='#ef4444'; cx.fillRect(sx,o.y+11*S,o.w,8*S);
      cx.fillStyle='rgba(255,255,255,.25)'; cx.fillRect(sx+2*S,o.y+2*S,o.w-4*S,4*S);
      cx.restore();
    }
    else if(o.type==='overhead'){
      cx.save();
      const g=cx.createLinearGradient(sx,o.y,sx,o.y+o.h);
      g.addColorStop(0,'#7c3aed'); g.addColorStop(1,'#4c1d95');
      cx.fillStyle=g; cx.beginPath(); cx.roundRect(sx,o.y,o.w,o.h,5*S); cx.fill();
      cx.fillStyle='rgba(255,255,255,.2)'; cx.fillRect(sx+4*S,o.y+3*S,o.w-8*S,4*S);
      // warning stripes
      cx.strokeStyle='rgba(251,191,36,.4)'; cx.lineWidth=2*S;
      for(let i=0;i<4;i++){
        const ex=sx+i*(o.w/4);
        cx.beginPath(); cx.moveTo(ex,o.y); cx.lineTo(ex+o.w/4*.6,o.y+o.h); cx.stroke();
      }
      cx.restore();
    }
    else if(o.type==='star'){
      o.pulse=(o.pulse||0)+.12;
      const bob=Math.sin(o.pulse)*3*S;
      cx.save(); cx.translate(sx,o.y+bob);
      // Draw bright yellow star (no emoji — drawn manually for vivid color)
      const r1=12*S, r2=5*S, pts=5;
      cx.shadowColor='#ffe000'; cx.shadowBlur=18*S;
      cx.fillStyle='#ffe000';
      cx.beginPath();
      for(let j=0;j<pts*2;j++){
        const a=j*Math.PI/pts - Math.PI/2;
        const r=j%2===0?r1:r2;
        j===0?cx.moveTo(Math.cos(a)*r,Math.sin(a)*r):cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      cx.closePath(); cx.fill();
      // bright white center highlight
      cx.shadowBlur=0; cx.fillStyle='rgba(255,255,200,.55)';
      cx.beginPath(); cx.arc(0,-2*S,4*S,0,Math.PI*2); cx.fill();
      cx.restore();
    }
    else if(o.type==='special'){
      o.pulse=(o.pulse||0)+.1;
      const bob=Math.sin(o.pulse)*3*S;
      const pc={'shield':'#38bdf8','magnet':'#818cf8','x2':'#fb923c'}[o.stype]||'#c084fc';
      const ic={'shield':'🛡️','magnet':'🧲','x2':'⚡'}[o.stype]||'❓';
      cx.save(); cx.translate(sx,o.y+bob);
      const gr=cx.createLinearGradient(-18*S,-18*S,18*S,18*S);
      gr.addColorStop(0,'#fff'); gr.addColorStop(1,pc);
      cx.fillStyle=gr; cx.shadowColor=pc; cx.shadowBlur=14*S;
      cx.beginPath(); cx.roundRect(-18*S,-18*S,36*S,36*S,8*S); cx.fill();
      cx.shadowBlur=0; cx.strokeStyle=pc; cx.lineWidth=2*S;
      cx.beginPath(); cx.roundRect(-18*S,-18*S,36*S,36*S,8*S); cx.stroke();
      cx.font=`${20*S}px Arial`; cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(ic,0,2*S); cx.restore();
    }
  });
}

// ── Draw Player ──
function drawPlayer(){
  const p=player;
  const pw=PW(), ph=PH();
  const x=p.x, y=p.y;

  // Shadow
  cx.fillStyle='rgba(0,0,80,.3)';
  cx.beginPath(); cx.ellipse(x+pw/2,GY()+3*S,22*S,6*S,0,0,Math.PI*2); cx.fill();

  // Shield glow
  if(p.shielded){
    const gl=cx.createRadialGradient(x+pw/2,y-ph/2,10*S,x+pw/2,y-ph/2,55*S);
    gl.addColorStop(0,'rgba(56,189,248,.3)'); gl.addColorStop(1,'rgba(56,189,248,0)');
    cx.fillStyle=gl; cx.beginPath(); cx.arc(x+pw/2,y-ph/2,55*S,0,Math.PI*2); cx.fill();
    cx.strokeStyle='rgba(56,189,248,.7)'; cx.lineWidth=2.5*S;
    cx.beginPath(); cx.arc(x+pw/2,y-ph/2,50*S,0,Math.PI*2); cx.stroke();
  }

  // Invincible blink
  if(p.invTimer>0&&Math.floor(p.invTimer/5)%2===1) return;

  cx.save();
  const bob=p.onGround||p.onPlat?Math.sin(p.runF*.22)*2*S:0;
  cx.translate(x+pw/2,y+bob);
  if(p.state==='jump') cx.scale(0.93,1.07);
  if(p.state==='djump') cx.scale(0.88,1.12);
  if(p.state==='cheer'){
    // spinning cheer jump: rotate based on vy
    cx.rotate(Math.sin(frame*.25)*.35);
    cx.shadowColor='#ffd700'; cx.shadowBlur=24*S;
  }
  if(p.state==='djump'){ cx.shadowColor='#c084fc'; cx.shadowBlur=20*S; }
  cx.drawImage(charImg,-pw/2-2*S,-ph,pw+4*S,ph+2*S);
  cx.shadowBlur=0;
  cx.restore();

  // Magnet ring indicator
  if(p.magnet){
    cx.strokeStyle='rgba(129,140,248,.35)'; cx.lineWidth=1.5*S;
    cx.setLineDash([5*S,5*S]);
    cx.beginPath(); cx.arc(x+pw/2,y-ph/2,p.magnetR,0,Math.PI*2); cx.stroke();
    cx.setLineDash([]);
  }
}

// ── HUD ──
function drawHUD(){
  const p=player;
  cx.save();
  // Score
  cx.fillStyle='rgba(0,0,0,.5)';
  cx.beginPath(); cx.roundRect(8*S,8*S,125*S,42*S,21*S); cx.fill();
  cx.fillStyle='#ffd700'; cx.shadowColor='#ffd700'; cx.shadowBlur=7*S;
  cx.font=`bold ${18*S}px Arial`; cx.textAlign='left';
  cx.fillText('⭐ '+stars,18*S,34*S); cx.shadowBlur=0;
  // Hi
  cx.fillStyle='rgba(0,0,0,.45)';
  cx.beginPath(); cx.roundRect(cv.width-128*S,8*S,120*S,42*S,21*S); cx.fill();
  cx.fillStyle='#c084fc'; cx.font=`bold ${15*S}px Arial`; cx.textAlign='right';
  cx.fillText('🏆 '+hiScore,cv.width-14*S,33*S);
  // Score
  cx.fillStyle='rgba(0,0,0,.4)';
  cx.beginPath(); cx.roundRect(cv.width/2-50*S,8*S,100*S,28*S,14*S); cx.fill();
  cx.fillStyle='#fff'; cx.font=`${13*S}px Arial`; cx.textAlign='center';
  cx.fillText(Math.floor(dist*.1)+' m',cv.width/2,27*S);
  // Home button (top-left)
  cx.fillStyle='rgba(0,0,0,.5)';
  cx.beginPath(); cx.roundRect(6*S,6*S,36*S,36*S,18*S); cx.fill();
  cx.font=`${18*S}px Arial`; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('🏠',24*S,24*S); cx.textBaseline='alphabetic';

  // Cheer burst cooldown ring
  const cd=p.cheerCD, maxCD=480;
  if(cd>0){
    const frac=1-cd/maxCD;
    cx.strokeStyle='rgba(255,255,255,.2)'; cx.lineWidth=3*S;
    cx.beginPath(); cx.arc(cv.width-26*S,cv.height-26*S,18*S,0,Math.PI*2); cx.stroke();
    cx.strokeStyle='#ffd700'; cx.lineWidth=3*S;
    cx.beginPath(); cx.arc(cv.width-26*S,cv.height-26*S,18*S,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); cx.stroke();
    cx.font=`${10*S}px Arial`; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillStyle='rgba(255,255,255,.7)';
    cx.fillText(Math.ceil(cd/60),cv.width-26*S,cv.height-26*S); cx.textBaseline='alphabetic';
  } else {
    cx.fillStyle='rgba(255,105,180,.9)'; cx.shadowColor='#ff69b4'; cx.shadowBlur=10*S;
    cx.beginPath(); cx.arc(cv.width-26*S,cv.height-26*S,18*S,0,Math.PI*2); cx.fill(); cx.shadowBlur=0;
    cx.font=`${16*S}px Arial`; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('🎀',cv.width-26*S,cv.height-26*S); cx.textBaseline='alphabetic';
  }

  // Active powerups
  let px2=8*S;
  if(p.shielded){ drawPill(px2,56*S,'🛡️','#38bdf8'); px2+=52*S; }
  if(p.magnet){   drawPill(px2,56*S,'🧲','#818cf8'); px2+=52*S; }
  if(p.scoreMulti>1){ drawPill(px2,56*S,'⚡x2','#fb923c'); }
  // Controls hint early
  if(frame<240){
    cx.globalAlpha=Math.max(0,1-frame/240);
    cx.fillStyle='rgba(0,0,0,.55)';
    cx.beginPath(); cx.roundRect(cv.width/2-130*S,cv.height-34*S,260*S,22*S,11*S); cx.fill();
    cx.fillStyle='rgba(255,255,255,.9)';
    cx.font=`${11*S}px Arial`; cx.textAlign='center';
    cx.fillText('Tippen = Springen  •  2 Finger = 🎀 Cheer Burst',cv.width/2,cv.height-18*S);
    cx.globalAlpha=1;
  }
  cx.restore();
}
function drawPill(x,y,txt,col){
  cx.save(); cx.fillStyle='rgba(0,0,0,.5)';
  cx.beginPath(); cx.roundRect(x,y,44*S,22*S,11*S); cx.fill();
  cx.fillStyle=col; cx.font=`${12*S}px Arial`; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(txt,x+22*S,y+11*S); cx.textBaseline='alphabetic'; cx.restore();
}

// ── Shop ──
function drawShop(){
  cx.save();
  cx.fillStyle='rgba(0,0,20,.88)'; cx.fillRect(0,0,cv.width,cv.height);
  // Header
  cx.fillStyle='rgba(5,0,35,.95)';
  cx.beginPath(); cx.roundRect(12*S,12*S,cv.width-24*S,cv.height-24*S,18*S); cx.fill();
  cx.strokeStyle='#ffd700'; cx.lineWidth=2.5*S;
  cx.beginPath(); cx.roundRect(12*S,12*S,cv.width-24*S,cv.height-24*S,18*S); cx.stroke();
  cx.fillStyle='#ffd700'; cx.shadowColor='#ffd700'; cx.shadowBlur=12*S;
  cx.font=`bold ${24*S}px Arial`; cx.textAlign='center';
  cx.fillText('🏪 SHOP',cv.width/2,44*S); cx.shadowBlur=0;
  cx.fillStyle='#fbbf24'; cx.font=`bold ${16*S}px Arial`;
  cx.fillText('⭐ '+stars+' Sterne',cv.width/2,66*S);

  shopBtns=[];
  const iH=78*S, startY=80*S, iW=cv.width-40*S;
  SHOP_ITEMS.forEach((item,i)=>{
    const iy=startY+i*iH;
    cx.fillStyle='rgba(20,5,60,.8)';
    cx.beginPath(); cx.roundRect(20*S,iy,iW,iH-6*S,12*S); cx.fill();
    cx.strokeStyle='rgba(160,80,255,.25)'; cx.lineWidth=1.5*S;
    cx.beginPath(); cx.roundRect(20*S,iy,iW,iH-6*S,12*S); cx.stroke();
    cx.font=`${24*S}px Arial`; cx.textAlign='left'; cx.fillText(item.icon,30*S,iy+38*S);
    cx.fillStyle='#fff'; cx.font=`bold ${14*S}px Arial`; cx.fillText(item.name,62*S,iy+24*S);
    cx.fillStyle='rgba(255,255,255,.55)'; cx.font=`${11.5*S}px Arial`; cx.fillText(item.desc,62*S,iy+40*S);
    // stock
    cx.fillStyle='#c084fc'; cx.font=`${11*S}px Arial`;
    cx.fillText('Vorrat: '+(inv[item.id]||0),62*S,iy+56*S);
    // Button
    const canBuy=stars>=item.price;
    const bx=iW-50*S, bw=64*S, bh=30*S, by2=iy+(iH-6*S)/2-bh/2;
    shopBtns.push({item,x:20*S+bx,y:by2,w:bw,h:bh,canBuy});
    const bg=cx.createLinearGradient(20*S+bx,by2,20*S+bx+bw,by2+bh);
    if(canBuy){bg.addColorStop(0,'#ec4899');bg.addColorStop(1,'#9d174d');}
    else{bg.addColorStop(0,'#374151');bg.addColorStop(1,'#1f2937');}
    cx.fillStyle=bg; cx.beginPath(); cx.roundRect(20*S+bx,by2,bw,bh,15*S); cx.fill();
    cx.fillStyle=canBuy?'#fff':'rgba(255,255,255,.4)';
    cx.font=`bold ${12*S}px Arial`; cx.textAlign='center';
    cx.fillText('⭐'+item.price,20*S+bx+bw/2,by2+bh*.66);
  });

  // Close button
  const cby=cv.height-42*S, cbx=cv.width/2-80*S;
  shopBtns.push({type:'close',x:cbx,y:cby,w:160*S,h:34*S});
  cx.fillStyle='rgba(100,50,200,.7)';
  cx.beginPath(); cx.roundRect(cbx,cby,160*S,34*S,17*S); cx.fill();
  cx.fillStyle='#fff'; cx.font=`bold ${15*S}px Arial`; cx.textAlign='center';
  cx.fillText('✕ Schliessen',cv.width/2,cby+22*S);
  cx.restore();
}

function handleShopClick(mx,my){
  shopBtns.forEach(btn=>{
    if(mx<btn.x||mx>btn.x+btn.w||my<btn.y||my>btn.y+btn.h) return;
    if(btn.type==='close'){ shopOpen=false; return; }
    if(!btn.canBuy||!btn.item) return;
    const item=btn.item;
    stars-=item.price; ST.set('stars',stars);
    inv[item.id]=(inv[item.id]||0)+1;
    saveInv(); sfxBuy();
  });
}

// ── Splash / Start Screen ──
let menuBtns=[];
function drawSplash(){
  cx.save();

  // Full-screen dark BG fallback
  cx.fillStyle='#04001a'; cx.fillRect(0,0,cv.width,cv.height);

  // Splash image fills entire canvas
  if(splashImg.naturalWidth>0){
    const iAR=splashImg.naturalWidth/splashImg.naturalHeight;
    const cAR=cv.width/cv.height;
    let dw,dh,dx,dy;
    if(iAR>cAR){ dh=cv.height; dw=dh*iAR; dx=(cv.width-dw)/2; dy=0; }
    else        { dw=cv.width; dh=dw/iAR; dx=0; dy=(cv.height-dh)/2; }
    cx.drawImage(splashImg,dx,dy,dw,dh);
  }


  // Bottom overlay for UI elements
  const gb2=cx.createLinearGradient(0,cv.height*.55,0,cv.height);
  gb2.addColorStop(0,'rgba(4,0,26,0)'); gb2.addColorStop(.3,'rgba(4,0,26,.75)'); gb2.addColorStop(1,'rgba(4,0,26,.95)');
  cx.fillStyle=gb2; cx.fillRect(0,cv.height*.55,cv.width,cv.height*.45);

  // Title card — centered vertically in bottom overlay
  const titleY=cv.height*.62;
  cx.textAlign='center';
  // Glow backdrop
  cx.fillStyle='rgba(0,0,20,.55)';
  cx.beginPath(); cx.roundRect(cv.width/2-130*S,titleY-46*S,260*S,100*S,20*S); cx.fill();
  // "Stella"
  cx.font=`bold ${42*S}px Arial`;
  cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=5*S; cx.strokeText('Stella',cv.width/2,titleY);
  cx.fillStyle='#ffd700'; cx.shadowColor='#ffd700'; cx.shadowBlur=22*S;
  cx.fillText('Stella',cv.width/2,titleY); cx.shadowBlur=0;
  // "Cheer&Run"
  cx.font=`bold ${26*S}px Arial`;
  cx.strokeStyle='rgba(0,0,0,.4)'; cx.lineWidth=4*S; cx.strokeText('Cheer&Run ✨',cv.width/2,titleY+32*S);
  cx.fillStyle='#ff69b4'; cx.shadowColor='#ff69b4'; cx.shadowBlur=14*S;
  cx.fillText('Cheer&Run ✨',cv.width/2,titleY+32*S); cx.shadowBlur=0;

  // Stars display
  cx.fillStyle='rgba(4,0,30,.65)';
  cx.beginPath(); cx.roundRect(cv.width/2-52*S,titleY+42*S,104*S,24*S,12*S); cx.fill();
  cx.fillStyle='#fbbf24'; cx.font=`bold ${12.5*S}px Arial`; cx.textAlign='center';
  cx.fillText('⭐ '+stars+' Sterne',cv.width/2,titleY+59*S);

  // Buttons
  menuBtns=[];
  const bw=cv.width*.72, bh=50*S, bx=(cv.width-bw)/2;
  const playY=cv.height*.78, shopY=cv.height*.78+58*S;
  const btns=[
    {label:'🎉 SPIELEN!',col0:'#ff69b4',col1:'#be185d',id:'play',by:playY},
    {label:'🏪 SHOP',   col0:'#7c3aed',col1:'#4c1d95',id:'shop',by:shopY},
  ];
  btns.forEach(b=>{
    menuBtns.push({id:b.id,x:bx,y:b.by,w:bw,h:bh});
    const bg=cx.createLinearGradient(bx,b.by,bx+bw,b.by+bh);
    bg.addColorStop(0,b.col0); bg.addColorStop(1,b.col1);
    cx.fillStyle=bg; cx.shadowColor=b.col0; cx.shadowBlur=18*S;
    cx.beginPath(); cx.roundRect(bx,b.by,bw,bh,25*S); cx.fill(); cx.shadowBlur=0;
    cx.fillStyle='#fff'; cx.font=`bold ${19*S}px Arial`; cx.textAlign='center';
    cx.fillText(b.label,bx+bw/2,b.by+33*S);
  });
  cx.restore();
}

// ── Game Over ──
let goBtns=[];
function drawGameOver(){
  cx.save();
  cx.fillStyle='rgba(0,0,0,.7)'; cx.fillRect(0,0,cv.width,cv.height);
  const cw=cv.width*.85,ch=cv.height*.55,cx2=(cv.width-cw)/2,cy2=cv.height*.22;
  cx.fillStyle='rgba(8,0,32,.97)'; cx.shadowColor='#ff69b4'; cx.shadowBlur=30*S;
  cx.beginPath(); cx.roundRect(cx2,cy2,cw,ch,22*S); cx.fill(); cx.shadowBlur=0;
  cx.strokeStyle='#ffd700'; cx.lineWidth=2.5*S;
  cx.beginPath(); cx.roundRect(cx2,cy2,cw,ch,22*S); cx.stroke();
  cx.textAlign='center';
  cx.fillStyle='#ff69b4'; cx.font=`bold ${28*S}px Arial`; cx.fillText('GAME OVER!',cv.width/2,cy2+48*S);
  cx.fillStyle='rgba(255,255,255,.55)'; cx.font=`${14*S}px Arial`; cx.fillText('Score:',cv.width/2,cy2+78*S);
  cx.fillStyle='#ffd700'; cx.shadowColor='#ffd700'; cx.shadowBlur=8*S;
  cx.font=`bold ${40*S}px Arial`; cx.fillText(Math.floor(dist*.1)+' m',cv.width/2,cy2+120*S); cx.shadowBlur=0;
  cx.fillStyle='#fbbf24'; cx.font=`${14*S}px Arial`;
  cx.fillText('Sterne: '+stars+'  |  Best: '+hiScore,cv.width/2,cy2+150*S);
  goBtns=[];
  const row1=[['🔄 Nochmal','#ff69b4','#be185d','play'],['🏪 Shop','#7c3aed','#4c1d95','shop']];
  row1.forEach(([lbl,c0,c1,id],i)=>{
    const bw=cw*.44,bh=46*S,bx=cx2+(i===0?16*S:cw*.5+8*S),by=cy2+ch-108*S;
    goBtns.push({id,x:bx,y:by,w:bw,h:bh});
    const bg=cx.createLinearGradient(bx,by,bx+bw,by+bh);
    bg.addColorStop(0,c0);bg.addColorStop(1,c1);
    cx.fillStyle=bg;cx.shadowColor=c0;cx.shadowBlur=12*S;
    cx.beginPath();cx.roundRect(bx,by,bw,bh,23*S);cx.fill();cx.shadowBlur=0;
    cx.fillStyle='#fff';cx.font=`bold ${16*S}px Arial`;cx.fillText(lbl,bx+bw/2,by+31*S);
  });
  // Home button
  const hbw=cw*.6,hbh=38*S,hbx=cx2+(cw-hbw)/2,hby=cy2+ch-52*S;
  goBtns.push({id:'home',x:hbx,y:hby,w:hbw,h:hbh});
  cx.fillStyle='rgba(80,80,120,.75)';
  cx.beginPath();cx.roundRect(hbx,hby,hbw,hbh,19*S);cx.fill();
  cx.fillStyle='rgba(255,255,255,.8)';cx.font=`${15*S}px Arial`;cx.textAlign='center';
  cx.fillText('🏠 Zum Startbildschirm',hbx+hbw/2,hby+26*S);
  cx.restore();
}

function handleMenuClick(mx,my){
  const btns=gs==='splash'?menuBtns:goBtns;
  btns.forEach(b=>{
    if(mx<b.x||mx>b.x+b.w||my<b.y||my>b.y+b.h) return;
    if(b.id==='play'){ gs='playing'; initGame(); bgmStart(); }
    else if(b.id==='shop') shopOpen=true;
    else if(b.id==='home'){ gs='splash'; shopOpen=false; }
  });
}

// ── Main Draw ──
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  if(gs==='splash'){ drawSplash(); if(shopOpen) drawShop(); return; }
  drawBG();
  drawWorld();
  // Particles
  cx.save();
  particles.forEach(p=>{
    cx.globalAlpha=Math.max(0,p.life/p.max);
    cx.fillStyle=p.col; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill();
  });
  cx.globalAlpha=1; cx.restore();
  drawPlayer();
  // Float texts
  cx.save();
  floatTxts.forEach(f=>{
    cx.globalAlpha=Math.max(0,f.life/f.max);
    cx.fillStyle=f.col; cx.shadowColor=f.col; cx.shadowBlur=7*S;
    cx.font=`bold ${f.sz}px Arial`; cx.textAlign='center';
    cx.fillText(f.txt,f.x,f.y);
  });
  cx.shadowBlur=0; cx.globalAlpha=1; cx.restore();
  if(gs==='playing') drawHUD();
  if(gs==='gameover'){ drawGameOver(); if(shopOpen) drawShop(); }
}

// ── Boot / Loop ──
let booted2=false;
function boot(){
  if(booted2) return; booted2=true;
  bgmStart();
  (function loop(){ update(); draw(); requestAnimationFrame(loop); })();
}
</script>
